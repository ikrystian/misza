; Limity uploadu dla panelu administratora (zdjęcia do 25 MB).
; Plik .user.ini działa przy PHP jako CGI/FastCGI/FPM — czyli na większości shared hostingów.
; Jeśli hosting używa mod_php, te wartości ustaw w panelu hostingu albo w php.ini.

upload_max_filesize = 25M
post_max_size = 26M
max_execution_time = 120
memory_limit = 512M
